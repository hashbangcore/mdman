[package]
name = "mdman"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Creates a man page from markdown."
publish = false

[dependencies]
anyhow = "1.0.102"
handlebars = { version = "6.4.0", features = ["dir_source"] }
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["html"] }
same-file = "1.0.6"
serde_json = "1.0.149"
url = "2.5.8"

[dev-dependencies]
snapbox = { version = "1.2.0", features = ["diff", "dir", "term-svg", "regex", "json"] }
